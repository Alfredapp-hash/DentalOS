services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dentalos
      POSTGRES_USER: dentalos
      POSTGRES_PASSWORD: dentalos_dev
    ports:
      - "5432:5432"
    volumes:
      - dentalos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalos -d dentalos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - dentalos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dentalos-postgres:
  dentalos-redis:
